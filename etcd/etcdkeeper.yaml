version: "3"

# etcd 可视化 web 界面
# https://github.com/evildecay/etcdkeeper

networks:
  net_def:
    external: true

services:
  etcdkeeper:
    image: deltaprojects/etcdkeeper:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1G"
    networks:
      - net_def
    environment:
      HOST: 0.0.0.0
      PORT: 8080
  #  ports:
  #  - 8080:8080